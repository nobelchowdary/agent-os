name: kind gVisor lifecycle

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      only_case:
        description: Campaign scope (targeted runs do not qualify full acceptance)
        type: choice
        required: true
        default: all
        options:
          - all
          - cancel_ignores_sigterm_until_gone
          - finished_kubelet_unavailable
          - load_16
          - load_64
          - boundary_checks

permissions:
  contents: read

concurrency:
  # A targeted diagnostic must never cancel the full acceptance campaign.
  group: kind-gvisor-${{ github.ref }}-${{ github.event.inputs.only_case || 'all' }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build --tag agent-os:kind-ci .
      - name: Create disposable kind cluster with verified gVisor
        run: python3 scripts/kind_cluster.py --execute
      - name: Preload API and pinned workload images
        run: |
          docker pull python@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          .local/kind-ci/bin/kind load docker-image --name agentos-ci agent-os:kind-ci python@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
      - name: Run actual kubelet lifecycle and failure campaign
        env:
          CAMPAIGN_CASE: ${{ github.event.inputs.only_case || 'all' }}
        run: |
          args=(--execute --sequential-runs 200 --crash-submits 500 --only-case "$CAMPAIGN_CASE")
          if test "$CAMPAIGN_CASE" = all; then
            args+=(--load-cases)
          fi
          python3 scripts/kind_integration.py "${args[@]}"
      - name: Upload sanitized campaign summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-gvisor-result
          path: .local/kind-ci/result.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove disposable cluster
        if: always()
        run: |
          if test -x .local/kind-ci/bin/kind && test -f .local/kind-ci/created-cluster; then
            .local/kind-ci/bin/kind delete cluster --name agentos-ci --kubeconfig .local/kind-ci/kubeconfig
          fi
