apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentos-state
  namespace: agentos-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentos-api
  namespace: agentos-system
  labels:
    app.kubernetes.io/name: agent-os
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-os
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-os
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: agent-os
    spec:
      serviceAccountName: agentos-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: agent-os:dev
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/agentos/config.json
            - --db=/var/lib/agentos/state/runs.db
            - --listen=:8080
          env:
            - name: AGENTOS_LOCAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentos-api-tokens
                  key: local-token
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/agentos
              readOnly: true
            - name: state
              mountPath: /var/lib/agentos
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: agentos-config
        - name: state
          persistentVolumeClaim:
            claimName: agentos-state
---
apiVersion: v1
kind: Service
metadata:
  name: agentos-api
  namespace: agentos-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-os
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
